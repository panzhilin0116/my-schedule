<!DOCTYPE html>
<!-- 临时测量页：仅供无头浏览器在指定 window-size 下量布局，验收后删除。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="starfield" aria-hidden="true"></div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="主导航"></nav>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
<div class="modal-root" id="modal-root"></div>
<div class="toast-root" id="toast-root"></div>

<script>
// 先塞入样例数据，让测量覆盖到长标题/时间/地点的真实排版
localStorage.setItem('schedule.tasks.v1', JSON.stringify([
  { id: 'm1', title: '交法语作业（含很长的标题用来压测换行与不横向溢出）', date: '2026-09-20', startTime: '19:50', endTime: '21:30', location: '教学二号楼4003', note: '备注', done: false, createdAt: 1 },
  { id: 'm2', title: '取快递', date: '2026-09-20', done: true, createdAt: 2 },
  { id: 'm3', title: '组会', date: '2026-09-21', startTime: '14:00', endTime: '15:30', location: '主楼302会议室', done: false, createdAt: 3 },
  { id: 'm4', title: '买返程票', date: '2026-09-25', done: false, createdAt: 4 }
]));
</script>
<script type="module">
import './main.js';
import { openTaskForm } from './components/taskForm.js';
import { openMiniCalendar } from './components/miniCalendar.js';

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function box(sel) {
  const el = document.querySelector(sel);
  if (!el) return null;
  const b = el.getBoundingClientRect();
  return { w: Math.round(b.width), h: Math.round(b.height), l: Math.round(b.left), t: Math.round(b.top) };
}

function snapshot(label) {
  const de = document.documentElement;
  return {
    label,
    innerW: window.innerWidth,
    scrollW: de.scrollWidth,
    clientW: de.clientWidth,
    overflowX: de.scrollWidth - de.clientWidth,
    rail: getComputedStyle(document.querySelector('.rail')).display,
    tabbar: getComputedStyle(document.querySelector('.tabbar')).display,
    viewBox: box('.view'),
    overlayBox: box('.overlay-panel'),
    widest: (() => {
      // 找出最右边超出视口的元素，便于定位破版元凶
      let worst = null;
      for (const el of document.querySelectorAll('body *')) {
        const b = el.getBoundingClientRect();
        if (b.width === 0) continue;
        if (!worst || b.right > worst.right) worst = { right: Math.round(b.right), cls: el.className || el.tagName };
      }
      return worst;
    })(),
  };
}

async function run() {
  const out = [];
  location.hash = '#/';
  await sleep(250);
  out.push(snapshot('home'));

  openMiniCalendar(new Date());
  await sleep(120);
  out.push(snapshot('miniCalendar'));
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));

  for (const [hash, sel] of [['#/timetable', '.tt-grid'], ['#/tasks', '.tk']]) {
    location.hash = hash;
    await sleep(250);
    out.push(snapshot(hash));
    if (hash === '#/tasks') {
      document.querySelector('.fab').click();
      await sleep(150);
      out.push(snapshot('taskForm'));
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
      await sleep(80);
    }
  }
  const pre = document.createElement('pre');
  pre.id = 'measure-out';
  pre.textContent = 'MEASURE:' + JSON.stringify(out);
  document.body.appendChild(pre);
}

window.addEventListener('load', () => { setTimeout(run, 100); });
</script>
</body>
</html>
