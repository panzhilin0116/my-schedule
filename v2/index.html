<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B14">
<meta name="description" content="个人日程管理系统：今日总览、每周课表、日程待办。">
<title>日程任务舱 · 个人日程管理</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070B14'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%233DD6F5' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23FF8A3D'/%3E%3C/svg%3E">
</head>
<body>
<div class="starfield" aria-hidden="true"></div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="主导航"></nav>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view" tabindex="-1">
      <!-- 首屏骨架：ES Module 与样式就绪前的占位，首次路由渲染会整体替换它。 -->
      <div class="skeleton" aria-hidden="true">
        <div class="skeleton-row" style="width:90%"></div>
        <div class="skeleton-row" style="width:78%"></div>
        <div class="skeleton-row" style="width:66%"></div>
        <div class="skeleton-row" style="width:54%"></div>
      </div>
    </main>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
<div class="modal-root" id="modal-root"></div>
<div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>

<script type="module" src="/main.js"></script>
</body>
</html>
